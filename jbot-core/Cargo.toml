[package]
name = "jbot-core"
version = "0.1.0"
authors = ["HBcao <hbcaoqaq@outlook.com>"]
license = "MIT OR Apache-2.0"
description = ""
homepage = "https://github.com/HBcao233/jbot"
repository = "https://github.com/HBcao233/jbot"
keywords = ["telegram", "bot"]
categories = []
edition = "2024"

[features]
core_curl = [
    "dep:wreq",
    "dep:wreq-util",
    "dep:futures-util",
]

[dependencies]
jbot-macro = { path = "../jbot-macro" }

grammers-client = { path = "../../grammers/grammers-client", default-features = false, features = ["fs", "html"] }
grammers-session = { path = "../../grammers/grammers-session", default-features = false, features = ["sqlite-storage"] }
grammers-tl-types = { path = "../../grammers/grammers-tl-types" }

anyhow = { version = "1.0.104", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = [
    "signal",
    "process",
] }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
linkme = { version = "0.3.37", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["std"] }

tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std", "env-filter"]}
tracing-appender = { version = "0.2.5", default-features = false }

# ========== optional ==========

wreq = { version = "0.16.1", features = ["query", "form", "json", "stream", "multipart"], optional = true }
wreq-util = { version = "0.2.0", optional = true }
futures-util = { version = "0.3.34", optional = true }
